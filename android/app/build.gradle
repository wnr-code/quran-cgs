apply plugin: 'com.android.application'

// The optional upload/release key comes from an ignored local properties file or CI secrets; never commit it.
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
def releaseValue = { String property, String environment -> releaseProperties.getProperty(property) ?: System.getenv(environment) }
def releaseStorePath = releaseValue('storeFile', 'QURANKU_KEYSTORE_FILE')
def releaseStorePassword = releaseValue('storePassword', 'QURANKU_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseValue('keyAlias', 'QURANKU_KEY_ALIAS')
def releaseKeyPassword = releaseValue('keyPassword', 'QURANKU_KEY_PASSWORD')
def canSignRelease = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = 'id.cgs.quranku'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'id.cgs.quranku'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep local debug upgrades above the last published Compose-era CI code (310).
        versionCode((System.getenv('QURANKU_VERSION_CODE') ?: '320') as Integer)
        versionName(System.getenv('QURANKU_VERSION_NAME') ?: packageVersion)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                def keyFile = new File(releaseStorePath)
                storeFile = keyFile.isAbsolute() ? keyFile : rootProject.file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) apply plugin: 'com.google.gms.google-services'
} catch (Exception ignored) {
    logger.info('google-services.json not found; Google services plugin not applied')
}
