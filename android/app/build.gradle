plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Kunci rilis tidak disimpan di repository; bisa diberikan lewat keystore.properties atau secrets CI.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ks = { String prop, String env -> ksProps.getProperty(prop) ?: System.getenv(env) }
def hasSigning = ks('storeFile', 'QURANKU_KEYSTORE_FILE') != null
def generatedNativeAssets = layout.buildDirectory.dir('generated/nativeAssets').get().asFile

tasks.register('copyNativeContent', Copy) {
    from(rootProject.file('../src/data')) {
        include 'doa-nu.json', 'dzikir.json', 'asmaul-husna.json'
    }
    into generatedNativeAssets
}

android {
    namespace 'id.cgs.quranku'
    compileSdk 36

    defaultConfig {
        applicationId 'id.cgs.quranku'
        minSdk 23
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode((System.getenv('QURANKU_VERSION_CODE') ?: '2') as Integer)
        versionName(System.getenv('QURANKU_VERSION_NAME') ?: new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version)
    }

    sourceSets {
        main.assets.srcDir generatedNativeAssets
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(ks('storeFile', 'QURANKU_KEYSTORE_FILE'))
                storePassword ks('storePassword', 'QURANKU_KEYSTORE_PASSWORD')
                keyAlias ks('keyAlias', 'QURANKU_KEY_ALIAS')
                keyPassword ks('keyPassword', 'QURANKU_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named('preBuild').configure { dependsOn('copyNativeContent') }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
