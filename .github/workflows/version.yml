# Menaikkan versi (patch) secara otomatis setiap ada merge/push ke main.
# Versi tampil di aplikasi (Tentang & Lainnya) bersama nomor build, jadi setiap rilis punya nomor versi baru.
# Untuk menaikkan minor/major: ubah "version" di package.json pada PR — angka itu dipakai apa adanya (tidak dinaikkan lagi).
name: Naikkan versi
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: version-bump
  cancel-in-progress: false
jobs:
  bump:
    # Commit kenaikan versi sendiri tidak memicu kenaikan berikutnya.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(versi):') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Naikkan versi patch
        run: |
          # Bila PR yang di-merge sudah menaikkan versi sendiri, pakai angka itu apa adanya
          # (supaya versi di PR = versi yang terpasang); selain itu naikkan patch.
          NOW=$(node -p "require('./package.json').version")
          BEFORE=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
          if [ -n "$BEFORE" ] && [ "$NOW" != "$BEFORE" ]; then
            echo "Versi sudah dinaikkan oleh PR: $BEFORE → $NOW"
            exit 0
          fi
          npm version patch --no-git-tag-version
          V=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(versi): $V"
          git push origin HEAD:main
