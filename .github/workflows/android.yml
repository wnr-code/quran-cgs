# Build the shared PWA UI into an Android APK/AAB through Capacitor and smoke-test it on Android 12 and Android 16.
# Optional Play upload-key signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Google Play App Signing keeps the app-signing key in Play Console.
name: Android build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'scripts/gen-local.mjs'
      - 'scripts/gen-icons.mjs'
      - 'worker/**'
      - '.github/workflows/android.yml'
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'scripts/gen-local.mjs'
      - 'scripts/gen-icons.mjs'
      - 'worker/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      QURANKU_VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # v4 runs on Node 24; v3 targeted the deprecated Node 20 runtime.
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Use GitHub Actions cache instead of the optional commercial Gradle cache provider.
          cache-provider: basic
      - name: Generate PWA and Android icons/splash assets
        run: npm run gen:icons
      - name: Build shared web UI and sync Capacitor Android assets
        run: npm run cap:sync
      - name: Assemble debug APK and host-side tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test the bundled UI on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Smoke-test the bundled UI on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Prepare optional Play upload-key signing
        id: release_signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            if [ -z "$KS_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo '::error::Upload keystore is configured, but a password or alias secret is missing.'
              exit 1
            fi
            echo "$KS" | base64 -d > "$RUNNER_TEMP/quranku.jks"
            echo "QURANKU_KEYSTORE_FILE=$RUNNER_TEMP/quranku.jks" >> "$GITHUB_ENV"
            echo "QURANKU_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "QURANKU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "QURANKU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
      - name: Verify APK and prepare install artifacts
        env:
          SIGNED: ${{ steps.release_signing.outputs.enabled }}
        run: |
          VER=$(node -p "require('./package.json').version")
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/QuranKu-$VER-uji.apk"
          if [ "$SIGNED" = true ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/QuranKu-$VER.apk"
            APK="$RUNNER_TEMP/apk/QuranKu-$VER.apk"
          else
            APK="$RUNNER_TEMP/apk/QuranKu-$VER-uji.apk"
          fi
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          {
            echo "### Android APK: $(basename "$APK")"
            echo '```'
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"
            grep -i 'SHA-256' "$RUNNER_TEMP/signature.txt"
            ls -lh "$APK" | awk '{print "size: " $5}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/aab/"
      - uses: actions/upload-artifact@v7
        with:
          name: QuranKu-APK-untuk-dipasang
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
      - name: Upload signed AAB for Play Console
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quranku-play-store-aab
          path: ${{ runner.temp }}/aab/*.aab
          if-no-files-found: error
      - name: Upload unsigned AAB for build validation only
        if: steps.release_signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quranku-aab-unsigned-build
          path: ${{ runner.temp }}/aab/*.aab
          if-no-files-found: error
      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/gradle-debug.log
          if-no-files-found: ignore
