# Membangun APK (uji) & AAB (Play Store) dari android/ tanpa perlu Android Studio lokal.
# Jalankan manual: tab Actions → "Android build" → Run workflow.
# Secrets (opsional, untuk build bertanda tangan): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QURANKU_VERSION_CODE: ${{ github.run_number }}0
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Android SDK 36 (SDK sudah tersedia di runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Siapkan keystore (bila secrets tersedia)
        id: release_signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            if [ -z "$KS_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo '::error::Keystore disediakan, tetapi salah satu secret password/alias belum diisi.'
              exit 1
            fi
            echo "$KS" | base64 -d > "$RUNNER_TEMP/quranku.jks"
            echo "QURANKU_KEYSTORE_FILE=$RUNNER_TEMP/quranku.jks" >> "$GITHUB_ENV"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK debug (untuk pengujian)
        run: |
          run_gradle() { gradle "$@" --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/gradle.log"; echo "::error::$(grep -E -A12 'What went wrong|error:|ERROR' "$RUNNER_TEMP/gradle.log" | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }; tail -n 5 "$RUNNER_TEMP/gradle.log"; }
          run_gradle :app:assembleDebug
      - name: Aktifkan akselerasi KVM untuk emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Uji awal aplikasi pada emulator Android 16
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash -o pipefail -c 'bash "$GITHUB_WORKSPACE/android/scripts/run-emulator-tests.sh" 2>&1 | tee "$RUNNER_TEMP/android-connected-tests.log"'
      - name: Upload log uji emulator jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-failure-log
          path: |
            ${{ runner.temp }}/android-connected-tests.log
            ${{ runner.temp }}/android-connected-tests-gradle.log
            ${{ runner.temp }}/android-emulator-logcat.txt
            android/app/build/outputs/androidTest-results/connected/debug/**
            android/app/build/reports/androidTests/connected/debug/**
          if-no-files-found: ignore
      - name: Build AAB + APK release
        env:
          QURANKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QURANKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QURANKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          run_gradle() { gradle "$@" --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/gradle.log"; echo "::error::$(grep -E -A12 'What went wrong|error:|ERROR' "$RUNNER_TEMP/gradle.log" | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }; tail -n 5 "$RUNNER_TEMP/gradle.log"; }
          run_gradle :app:bundleRelease :app:assembleRelease
      - name: Laporkan diagnostik compiler Android
        if: failure()
        working-directory: android
        run: |
          for log in "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/android-connected-tests-gradle.log"; do
            if [ -f "$log" ]; then
              grep -E '^(e:)|: error:|Unresolved reference|Type mismatch|Overload resolution ambiguity|Cannot infer|No value passed|Too many arguments|No parameter with name' "$log" | tail -n 60 | while IFS= read -r line; do
                escaped=${line//'%'/'%25'}
                escaped=${escaped//$'\r'/'%0D'}
                printf '::error title=Android compiler::%s\n' "$escaped"
              done || true
            fi
          done
      - name: Kumpulkan & periksa APK yang bisa dipasang
        run: |
          VER=$(node -p "require('../package.json').version")
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/pasang" "$RUNNER_TEMP/toko"
          REL=app/build/outputs/apk/release/app-release.apk
          if [ -f "$REL" ]; then
            cp "$REL" "$RUNNER_TEMP/pasang/QuranKu-$VER.apk"; JENIS="rilis (kunci tetap)"
          else
            # Tanpa kunci rilis, APK release tidak bertanda tangan dan DITOLAK Android — jangan dibagikan.
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pasang/QuranKu-$VER-uji.apk"; JENIS="uji (kunci sementara)"
          fi
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/toko/" 2>/dev/null || true
          APK=$(ls "$RUNNER_TEMP"/pasang/*.apk)
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/sig.txt"
          {
            echo "### APK siap dipasang: $(basename "$APK") — $JENIS"
            echo '```'
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"
            grep -i "SHA-256" "$RUNNER_TEMP/sig.txt"
            ls -l "$APK" | awk '{print "ukuran: " $5 " byte"}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK::$(basename "$APK") | $JENIS | $("$BT/aapt2" dump badging "$APK" | grep -E '^package:') | $(grep -ci 'SHA-256' "$RUNNER_TEMP/sig.txt") tanda tangan | $(stat -c %s "$APK") byte"
      - uses: actions/upload-artifact@v4
        with:
          name: QuranKu-APK-untuk-dipasang
          path: ${{ runner.temp }}/pasang/*.apk
      - name: Unggah AAB bertanda tangan untuk Google Play
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quranku-play-store-aab
          path: ${{ runner.temp }}/toko/*.aab
          if-no-files-found: error
      - name: Unggah AAB tanpa tanda tangan (validasi build saja)
        if: steps.release_signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quranku-aab-unsigned-build
          path: ${{ runner.temp }}/toko/*.aab
          if-no-files-found: error
