# Build the shared PWA UI into an Android APK/AAB through Capacitor and smoke-test it on Android 12 and Android 16.
# Release artifacts are produced only when all four GitHub Actions upload-key secrets are configured;
# the AAB is verified and uploaded as a GitHub artifact only, never published to Google Play by this workflow.
# Google Play App Signing keeps the app-signing key in Play Console; this keystore is the upload key.
name: Android build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'scripts/gen-local.mjs'
      - 'scripts/gen-icons.mjs'
      - 'worker/**'
      - '.github/workflows/android.yml'
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'scripts/gen-local.mjs'
      - 'scripts/gen-icons.mjs'
      - 'worker/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      QURANKU_VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # v4 runs on Node 24; v3 targeted the deprecated Node 20 runtime.
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Use GitHub Actions cache instead of the optional commercial Gradle cache provider.
          cache-provider: basic
      - name: Generate PWA and Android icons/splash assets
        run: npm run gen:icons
      - name: Build shared web UI and sync Capacitor Android assets
        run: npm run cap:sync
      - name: Assemble debug APK and host-side tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Report Android unit-test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in glob.glob('android/app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      details = failure.get('message') or failure.text or 'No failure message in JUnit report.'
                      details = ' '.join(details.split())
                      title = f"{case.get('classname', 'Android unit test')}.{case.get('name', 'failure')}"
                      safe = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title={title}::{safe}')
                      found = True
          if not found:
              print('::notice title=Android test diagnostics::No failed JUnit test report was found.')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test the bundled UI on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Smoke-test the bundled UI on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Prepare Play upload-key signing
        id: release_signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$KS" "$KS_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done

          if [ "$configured" -eq 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Release signing secrets are not configured; debug tests will run, but release APK/AAB outputs will be skipped.'
            {
              echo '### Android release signing'
              echo 'Skipped: add all four upload-key secrets to enable signed release outputs. No unsigned AAB is created or uploaded.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo '::error::Release signing is partially configured. Set all four upload-key secrets before building a release.'
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/quranku-upload.jks"
          umask 077
          if ! printf '%s' "$KS" | base64 --decode > "$KEYSTORE_PATH"; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not valid base64.'
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo '::error::The decoded upload keystore is empty.'
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KS_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::The upload keystore could not be opened with the configured password and alias. Check the GitHub secrets; values are not printed.'
            exit 1
          fi

          echo "QURANKU_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "QURANKU_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
          echo "QURANKU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QURANKU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Build release APK and AAB
        if: steps.release_signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
      - name: Verify APK and prepare install artifacts
        env:
          SIGNED: ${{ steps.release_signing.outputs.enabled }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/aab"
          cp "$DEBUG_APK" "$RUNNER_TEMP/apk/QuranKu-$VER-uji.apk"
          "$BT/apksigner" verify --print-certs "$DEBUG_APK" > "$RUNNER_TEMP/debug-signature.txt"

          if [ "$SIGNED" = true ]; then
            RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)
            if [ ! -f "$RELEASE_APK" ] || [ -z "$AAB" ]; then
              echo '::error::The signed release APK or AAB was not produced.'
              exit 1
            fi

            cp "$RELEASE_APK" "$RUNNER_TEMP/apk/QuranKu-$VER.apk"
            "$BT/apksigner" verify --print-certs "$RELEASE_APK" > "$RUNNER_TEMP/release-signature.txt"
            jar tf "$AAB" > "$RUNNER_TEMP/aab-entries.txt"
            if ! grep -Eiq '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' "$RUNNER_TEMP/aab-entries.txt"; then
              echo '::error::The release AAB does not contain a signature block.'
              exit 1
            fi
            if ! jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1 || ! grep -Eiq 'jar verified' "$RUNNER_TEMP/aab-signature-check.txt"; then
              echo '::error::The release AAB signature could not be verified.'
              exit 1
            fi
            cp "$AAB" "$RUNNER_TEMP/aab/"
            echo 'Release APK and AAB signatures verified. The AAB is available as a GitHub artifact only; this workflow does not publish it to Google Play.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release outputs skipped because upload-key secrets are not configured; only the debug test APK is available.' >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Android APK for testing: QuranKu-$VER-uji.apk"
            echo '```'
            "$BT/aapt2" dump badging "$DEBUG_APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"
            ls -lh "$RUNNER_TEMP/apk/QuranKu-$VER-uji.apk" | awk '{print "size: " $5}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNED" = true ]; then
            {
              echo "### Signed release APK: QuranKu-$VER.apk"
              echo '```'
              "$BT/aapt2" dump badging "$RELEASE_APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"
              ls -lh "$RUNNER_TEMP/apk/QuranKu-$VER.apk" | awk '{print "size: " $5}'
              echo 'AAB signature verification: passed'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove temporary upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/quranku-upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: QuranKu-APK-untuk-dipasang
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
      - name: Upload signed AAB artifact (GitHub only)
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quranku-play-store-aab-signed
          path: ${{ runner.temp }}/aab/*.aab
          if-no-files-found: error
      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/gradle-debug.log
          if-no-files-found: ignore
