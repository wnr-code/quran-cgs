# Konfigurasi Cloudflare Workers (dengan aset statis). Dipakai oleh `npx wrangler deploy`.
# `name` harus sama dengan nama Worker di dashboard Cloudflare.
# Secret TIDAK ditulis di sini — isi lewat dashboard (Settings → Variables and Secrets). Daftarnya: docs/INFAQ.md
name = "quran-cgs"
main = "worker/index.js"
compatibility_date = "2025-10-01"

# Aplikasi dibangun otomatis sebelum deploy (hasil di dist/).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

# Infaq: username halaman pembayaran & harga 1 unit (rupiah) = nominal minimal infaq.
# INFAQ_UNIT_PRICE HARUS sama dengan harga unit di akun pembayaran Anda (di sana juga harus Rp1.000).
[vars]
INFAQ_USERNAME = "lanteraku"
INFAQ_UNIT_PRICE = "1000"

# Tiap menit: push pengingat adzan yang jatuh tempo; tiap 15 menit: sinkronisasi riwayat infaq (gratis).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "quran"
database_id = "ff7eac46-cb79-409d-9edd-a743f299b50e"
