# Konfigurasi Cloudflare Workers (dengan aset statis), untuk deploy dan Preview Wrangler.
# `name` harus sama dengan nama Worker di dashboard Cloudflare.
# Secret TIDAK ditulis di sini — isi lewat dashboard (Settings → Variables and Secrets). Daftarnya: docs/INFAQ.md
name = "quran-cgs"
main = "worker/index.js"
compatibility_date = "2025-10-01"
# Alamat cadangan https://quran-cgs.appwnr.workers.dev harus tetap aktif (dipakai otomatis bila domain utama mati).
workers_dev = true

# Wrangler preview deployments require an explicit observability policy.
[previews.observability]
enabled = true
head_sampling_rate = 1

[previews.observability.issues]
enabled = false

[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Aplikasi dibangun otomatis sebelum deploy (hasil di dist/).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

# Infaq: username halaman pembayaran & harga 1 unit (rupiah) = nominal minimal infaq.
# INFAQ_UNIT_PRICE HARUS sama dengan harga unit di akun pembayaran Anda (di sana juga harus Rp1.000).
[vars]
INFAQ_USERNAME = "lanteraku"
INFAQ_UNIT_PRICE = "1000"

# Tiap menit: push pengingat adzan yang jatuh tempo; tiap 15 menit: sinkronisasi riwayat infaq (gratis).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "quran"
database_id = "ff7eac46-cb79-409d-9edd-a743f299b50e"
